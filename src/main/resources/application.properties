# Server Port
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=coRide Java Web App

# SQLite Database configuration with HikariCP
spring.datasource.url=${DB_URL:jdbc:sqlite:coride.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP Connection Pool settings optimized for SQLite
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=CoRideSQLitePool

# JPA & Hibernate properties for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
